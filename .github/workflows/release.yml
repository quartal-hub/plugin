name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the version PR branch and push git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # the npm publish credential itself (trusted publishing) + provenance
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # changesets needs history to diff against baseBranch

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url on purpose: it exists to write an .npmrc with
          # _authToken=${NODE_AUTH_TOKEN}, and publishing now uses trusted
          # publishing (OIDC) with no token. An .npmrc carrying an empty token
          # surfaces as a 401 instead of falling through to OIDC.

      - run: pnpm install --frozen-lockfile

      # Gates. npm versions are immutable, so a bad publish is permanent.
      #
      # build runs before typecheck and test on purpose: plugin-core exposes its
      # types via dist/mod.d.ts, so on a clean checkout every package importing
      # @quartal/plugin-core fails to resolve it until dist/ exists.
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test

      - uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
